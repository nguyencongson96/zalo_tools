<!doctype html>
<!--
  TEMPLATE GIAO DIỆN DUY NHẤT của trang theo dõi (data/tracking/index.html).
  - Mọi trang HTML do scripts/render.js sinh ra đều lấy từ file này. Muốn đổi giao diện: sửa Ở ĐÂY, rồi chạy
    "node scripts/rebuild.js" (hoặc đợi lần quét kế tiếp) để trang được dựng lại.
  - File nằm NGOÀI thư mục data/ nên các thao tác đăng xuất / xóa dữ liệu (logout) không bao giờ xóa nó.
  - Hai chỗ giữ chỗ bắt buộc: {{TITLE}} (tiêu đề tab trình duyệt) và {{BODY}} (nội dung do tracking.js dựng).
  - Các class dùng trong BODY: header.top .upd | section.stats .stat(.alert/.ok) .n .l | nav.tabs button[data-tab] .cnt |
    section[data-panel] | .toolbar #q .chip[data-f] | .list details.item(.hot) summary .av .nm .t .snip .meta .badges .b(.red/.grn/.amb/.blue/.gray)
    .detail .facts .tl li(.rd) .when .who .txt | details.rep .prose | .empty #none | .note | .muted
-->
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#172033;--mut:#6b7587;--line:#e6e9f0;--soft:#f7f8fb;--acc:#0068ff;--accbg:#e8f1ff;
--red:#d92d20;--redbg:#fee9e7;--grn:#067647;--grnbg:#e3f7ec;--amb:#b54708;--ambbg:#fff2d6;
--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0e121a;--card:#161b26;--ink:#e8ebf2;--mut:#93a0b5;--line:#262d3b;--soft:#1b2130;--acc:#6aa6ff;--accbg:#172743;
--red:#ff9b92;--redbg:#3a1b19;--grn:#62e0a0;--grnbg:#113024;--amb:#fbc65b;--ambbg:#342708;--sh:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:960px;margin:0 auto;padding:28px 16px 64px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.7rem;line-height:1.2;margin:0;letter-spacing:-.01em}
.upd{color:var(--mut);font-size:.88rem}.upd b{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:14px 16px}
.stat .n{font-size:1.9rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}.stat .l{color:var(--mut);font-size:.84rem;margin-top:2px}
.stat.alert .n{color:var(--red)}.stat.ok .n{color:var(--grn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{font:inherit;font-weight:600;color:var(--mut);background:none;border:0;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--acc);border-color:var(--acc)}.tabs button:hover{color:var(--ink)}
.tabs .cnt{font-size:.75rem;background:var(--soft);color:var(--mut);border-radius:99px;padding:1px 8px;margin-left:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{flex:1 1 220px;font:inherit;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.toolbar input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.chip{font:inherit;font-size:.86rem;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
details.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
details.item.hot{border-left:4px solid var(--red)}
details.item[open]{border-color:var(--acc)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
summary::-webkit-details-marker{display:none}summary:hover{background:var(--soft)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:hsl(var(--h) 55% 48%)}
.nm{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nm .t{font-size:.72rem;font-weight:600;color:var(--mut);background:var(--soft);border-radius:6px;padding:0 6px}
.snip{color:var(--mut);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}
.snip b{color:var(--ink);font-weight:600}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}.meta time{color:var(--mut);font-size:.78rem;white-space:nowrap}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.76rem;font-weight:600;white-space:nowrap}
.b.red{background:var(--redbg);color:var(--red)}.b.blue{background:var(--accbg);color:var(--acc)}.b.grn{background:var(--grnbg);color:var(--grn)}
.b.amb{background:var(--ambbg);color:var(--amb)}.b.gray{background:var(--soft);color:var(--mut)}
.detail{padding:4px 16px 16px 70px;border-top:1px solid var(--line)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;margin:12px 0 4px;font-size:.9rem}
.facts dt{color:var(--mut)}.facts dd{margin:0}
.detail h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:16px 0 8px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 14px}
.tl li::before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tl li.rd::before{background:var(--grn)}
.tl li.mine::before{background:var(--mut)}.tl li.mine .txt,.tl li.mine .who{color:var(--mut)}
.tl .when{color:var(--mut);font-size:.78rem}.tl .who{font-weight:600}.tl .txt{word-break:break-word}
.muted{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:36px 12px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.note{color:var(--mut);font-size:.82rem;margin-top:18px}
details.rep{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
details.rep>summary{display:flex;justify-content:space-between;font-weight:600;padding:14px 18px}
.prose{padding:2px 22px 20px;border-top:1px solid var(--line)}
.prose h1{font-size:1.3rem;margin:1em 0 .3em}.prose h2{font-size:1.1rem;margin:1.4em 0 .4em}.prose h3{font-size:1rem;margin:1.1em 0 .3em}
.prose ul,.prose ol{padding-left:1.4em}.prose li{margin:.25em 0}
.prose blockquote{margin:1em 0;padding:.3em 1em;border-left:3px solid var(--acc);background:var(--soft);border-radius:0 8px 8px 0;color:var(--mut)}
.prose a{color:var(--acc)}.prose hr{border:0;border-top:1px solid var(--line);margin:1.4rem 0}
.prose code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.88em}
.prose .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:.8em 0}
.prose table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
.prose th,.prose td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.prose th{background:var(--soft);color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.prose tr:last-child td{border-bottom:0}
@media (max-width:620px){
 .stats{gap:8px}.stat{padding:10px 12px}.stat .n{font-size:1.5rem}
 summary{grid-template-columns:40px 1fr;row-gap:6px}.av{width:40px;height:40px}.meta{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;text-align:left}
 .detail{padding:4px 14px 14px}.facts{grid-template-columns:1fr;gap:0}.facts dt{margin-top:8px}.snip{max-width:none}
}
</style></head>
<body><div class="app">
{{BODY}}
</div>
<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
function show(t){$$('[data-tab]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===t)});
 $$('[data-panel]').forEach(function(p){p.hidden=p.dataset.panel!==t});try{history.replaceState(null,'','#'+t)}catch(e){}}
$$('[data-tab]').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.tab)})});
var f='all',q=$('#q');
function apply(){var s=(q.value||'').trim().toLowerCase(),n=0;
 $$('.item').forEach(function(it){
  var ok=(!s||it.dataset.name.indexOf(s)>-1)&&(f==='all'||(f==='new'&&it.dataset.new==='1')||(f==='rel'&&it.dataset.rel==='yes'));
  it.hidden=!ok;if(ok)n++});
 $('#none').hidden=n>0}
if(q){q.addEventListener('input',apply)}
$$('.chip').forEach(function(c){c.addEventListener('click',function(){f=c.dataset.f;
 $$('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===c)});apply()})});
var h=(location.hash||'').slice(1);show(h==='reports'?'reports':'watch');
setInterval(function(){if(!document.querySelector('details[open].item')&&!(q&&q.value))location.reload()},60000);
})();
</script>
</body></html>
